name: CI

on:
  pull_request:
    branches: [main, prod, feature_1.0]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://easebuild.in
      NEXT_PUBLIC_CONTACT_EMAIL: hello@easebuild.in
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
