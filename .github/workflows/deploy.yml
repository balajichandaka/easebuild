name: Deploy to EC2

on:
  push:
    branches: [release_1.0]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-release_1.0
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy (release_1.0)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      DEPLOY_BRANCH: release_1.0
    steps:
      - name: Log deploy target
        run: |
          APP_DIR="${{ secrets.EC2_APP_DIR || vars.EC2_APP_DIR }}"
          if [ -z "$APP_DIR" ]; then APP_DIR='~/easebuild (default on EC2)'; fi
          echo "══════════════════════════════════════════"
          echo "  DEPLOY TARGET (GitHub Actions)"
          echo "══════════════════════════════════════════"
          echo "  Branch:       release_1.0"
          echo "  SSH user:     ${{ secrets.EC2_USER || vars.EC2_USER }}"
          echo "  SSH host:     ${{ secrets.EC2_HOST || vars.EC2_HOST }}"
          echo "  App dir:      $APP_DIR"
          echo "══════════════════════════════════════════"

      - name: Validate SSH config
        run: |
          HOST="${{ secrets.EC2_HOST || vars.EC2_HOST }}"
          USER="${{ secrets.EC2_USER || vars.EC2_USER }}"
          KEY="${{ secrets.EC2_SSH_KEY || vars.EC2_SSH_KEY }}"
          missing=""
          if [ -z "$HOST" ]; then missing="${missing} EC2_HOST"; fi
          if [ -z "$USER" ]; then missing="${missing} EC2_USER"; fi
          if [ -z "$KEY" ]; then missing="${missing} EC2_SSH_KEY"; fi
          if [ -n "$missing" ]; then
            echo "ERROR: Missing repository secrets:$missing"
            echo ""
            echo "Add under Settings → Secrets and variables → Actions:"
            echo "  EC2_HOST = your EC2 public IP"
            echo "  EC2_USER = ec2-user"
            echo "  EC2_SSH_KEY = .pem file contents"
            exit 1
          fi
          if [ -n "${{ vars.EC2_SSH_KEY }}" ] && [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "WARNING: EC2_SSH_KEY is in Variables — move it to Secrets for security."
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_BRANCH: release_1.0
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL || vars.APP_PUBLIC_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL || vars.CONTACT_EMAIL }}
        with:
          host: ${{ secrets.EC2_HOST || vars.EC2_HOST }}
          username: ${{ secrets.EC2_USER || vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY || vars.EC2_SSH_KEY }}
          command_timeout: 2h
          envs: DEPLOY_BRANCH,APP_PUBLIC_URL,CONTACT_EMAIL
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR || vars.EC2_APP_DIR }}"
            if [ -z "${APP_DIR}" ]; then APP_DIR="$HOME/easebuild"; fi
            export APP_DIR

            PUBLIC_IP="$(curl -sf http://checkip.amazonaws.com 2>/dev/null || hostname -I | awk '{print $1}')"

            echo "══════════════════════════════════════════"
            echo "  CONNECTED TO EC2"
            echo "══════════════════════════════════════════"
            echo "  Branch:       release_1.0"
            echo "  App dir:      $APP_DIR"
            echo "  Hostname:     $(hostname)"
            echo "  Public IP:    ${PUBLIC_IP:-unknown}"
            echo "══════════════════════════════════════════"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: Repo not found at $APP_DIR. Run 'Bootstrap EC2' first."
              exit 1
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: Docker not installed. Run 'Bootstrap EC2' first."
              exit 1
            fi

            cd "$APP_DIR"
            DEPLOY_BRANCH="release_1.0" APP_DIR="$APP_DIR" ./scripts/deploy-ec2.sh
