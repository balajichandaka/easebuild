<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- faint ledger columns -->
  <g stroke="#e3e7ee" stroke-width="1" opacity="0.7">
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  <g transform="translate(90,110)">
    <rect width="72" height="72" rx="16" fill="url(#mark)"/>
    <text x="36" y="49" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="34" fill="#ffffff">CA</text>
    <circle cx="60" cy="60" r="8" fill="#c4922f" stroke="#ffffff" stroke-width="3"/>
    <text x="92" y="30" font-family="Georgia, serif" font-weight="700" font-size="26" fill="#0f1b2d">CA Firm Ops</text>
    <text x="92" y="58" font-family="Arial, sans-serif" font-size="16" fill="#46536e">Work Management</text>
  </g>
  <text x="90" y="330" font-family="Georgia, serif" font-weight="700" font-size="66" fill="#0f1b2d">Every filing, every client,</text>
  <text x="90" y="410" font-family="Georgia, serif" font-weight="700" font-size="66" fill="#2563eb">every deadline — handled.</text>
  <text x="90" y="475" font-family="Arial, sans-serif" font-size="26" fill="#46536e">One deadline-aware workspace for chartered accountant firms.</text>
  <g transform="translate(90,520)">
    <rect width="220" height="58" rx="12" fill="#2563eb"/>
    <text x="110" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="20" fill="#ffffff">Book a demo</text>
  </g>
</svg>
