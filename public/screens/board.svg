<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="460" fill="#f7f8fa"/>
  <!-- top bar -->
  <rect width="720" height="48" fill="#ffffff"/>
  <line x1="0" y1="48" x2="720" y2="48" stroke="#e3e7ee"/>
  <circle cx="24" cy="24" r="5" fill="#d3d9e4"/><circle cx="40" cy="24" r="5" fill="#d3d9e4"/><circle cx="56" cy="24" r="5" fill="#d3d9e4"/>
  <text x="80" y="29" font-size="13" font-weight="700" fill="#0f1b2d">Board</text>
  <rect x="600" y="14" width="96" height="22" rx="6" fill="#2563eb"/>
  <text x="648" y="29" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">New ticket</text>

  <!-- columns -->
  <g>
    <!-- headers -->
    <text x="24" y="78" font-size="11" font-weight="700" fill="#46536e">OPEN · 3</text>
    <text x="192" y="78" font-size="11" font-weight="700" fill="#2563eb">IN PROGRESS · 2</text>
    <text x="360" y="78" font-size="11" font-weight="700" fill="#c4922f">REVIEW · 1</text>
    <text x="528" y="78" font-size="11" font-weight="700" fill="#15803d">DONE · 2</text>
  </g>

  <!-- card template groups -->
  <!-- OPEN -->
  <g>
    <rect x="24" y="90" width="150" height="66" rx="8" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="36" y="112" font-size="11" font-weight="700" fill="#0f1b2d">GSTR-3B Filing</text>
    <text x="36" y="130" font-size="10" fill="#46536e">Sharma Traders</text>
    <rect x="36" y="138" width="42" height="14" rx="7" fill="#eef3ff"/><text x="57" y="148" text-anchor="middle" font-size="8" fill="#2563eb">MEDIUM</text>
    <text x="150" y="148" text-anchor="end" font-size="9" fill="#d1483a">11 Jul</text>

    <rect x="24" y="164" width="150" height="66" rx="8" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="36" y="186" font-size="11" font-weight="700" fill="#0f1b2d">TDS Return 26Q</text>
    <text x="36" y="204" font-size="10" fill="#46536e">Ramesh Gupta</text>
    <text x="150" y="222" text-anchor="end" font-size="9" fill="#46536e">14 Jul</text>
  </g>
  <!-- IN PROGRESS -->
  <g>
    <rect x="192" y="90" width="150" height="66" rx="8" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="204" y="112" font-size="11" font-weight="700" fill="#0f1b2d">ITR-3 Filing</text>
    <text x="204" y="130" font-size="10" fill="#46536e">Balaji Consulting</text>
    <rect x="204" y="138" width="30" height="14" rx="7" fill="#faf3e4"/><text x="219" y="148" text-anchor="middle" font-size="8" fill="#c4922f">HIGH</text>
    <text x="318" y="148" text-anchor="end" font-size="9" fill="#46536e">18 Jul</text>
  </g>
  <!-- REVIEW -->
  <g>
    <rect x="360" y="90" width="150" height="66" rx="8" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="372" y="112" font-size="11" font-weight="700" fill="#0f1b2d">ROC MGT-7</text>
    <text x="372" y="130" font-size="10" fill="#46536e">Sri Hardware</text>
    <text x="486" y="148" text-anchor="end" font-size="9" fill="#46536e">22 Jul</text>
  </g>
  <!-- DONE -->
  <g>
    <rect x="528" y="90" width="150" height="66" rx="8" fill="#ffffff" stroke="#e3e7ee"/>
    <text x="540" y="112" font-size="11" font-weight="700" fill="#0f1b2d">GSTR-1</text>
    <text x="540" y="130" font-size="10" fill="#46536e">Padala &amp; Co.</text>
    <circle cx="546" cy="145" r="6" fill="#e8f5ec"/><path d="M543 145 l2 2 l4 -4" stroke="#15803d" stroke-width="1.5" fill="none"/>
    <text x="666" y="148" text-anchor="end" font-size="9" fill="#15803d">Filed</text>
  </g>

  <!-- faint column separators -->
  <g stroke="#e3e7ee" stroke-dasharray="3 4" opacity="0.7">
    <line x1="182" y1="90" x2="182" y2="440"/>
    <line x1="350" y1="90" x2="350" y2="440"/>
    <line x1="518" y1="90" x2="518" y2="440"/>
  </g>
</svg>
