<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="460" fill="#f7f8fa"/>
  <rect width="720" height="48" fill="#ffffff"/>
  <line x1="0" y1="48" x2="720" y2="48" stroke="#e3e7ee"/>
  <circle cx="24" cy="24" r="5" fill="#d3d9e4"/><circle cx="40" cy="24" r="5" fill="#d3d9e4"/><circle cx="56" cy="24" r="5" fill="#d3d9e4"/>
  <text x="80" y="29" font-size="13" font-weight="700" fill="#0f1b2d">Recurring schedules</text>

  <!-- table header -->
  <text x="24" y="82" font-size="10" font-weight="700" fill="#46536e">WORK</text>
  <text x="300" y="82" font-size="10" font-weight="700" fill="#46536e">CADENCE</text>
  <text x="470" y="82" font-size="10" font-weight="700" fill="#46536e">NEXT DUE</text>
  <text x="600" y="82" font-size="10" font-weight="700" fill="#46536e">STATUS</text>
  <line x1="24" y1="92" x2="696" y2="92" stroke="#e3e7ee"/>

  <!-- rows -->
  <g font-size="11">
    <!-- row 1 -->
    <text x="24" y="122" font-weight="700" fill="#0f1b2d">GSTR-3B — all GST clients</text>
    <rect x="300" y="110" width="70" height="18" rx="9" fill="#eef3ff"/><text x="335" y="123" text-anchor="middle" font-size="9" fill="#2563eb">Monthly</text>
    <text x="470" y="123" fill="#0f1b2d" font-family="monospace">11 Aug 2026</text>
    <circle cx="606" cy="119" r="4" fill="#15803d"/><text x="616" y="123" fill="#15803d">Active</text>
    <line x1="24" y1="140" x2="696" y2="140" stroke="#e3e7ee"/>
    <!-- row 2 -->
    <text x="24" y="170" font-weight="700" fill="#0f1b2d">TDS 26Q — quarterly</text>
    <rect x="300" y="158" width="78" height="18" rx="9" fill="#faf3e4"/><text x="339" y="171" text-anchor="middle" font-size="9" fill="#c4922f">Quarterly</text>
    <text x="470" y="171" fill="#0f1b2d" font-family="monospace">31 Jul 2026</text>
    <circle cx="606" cy="167" r="4" fill="#15803d"/><text x="616" y="171" fill="#15803d">Active</text>
    <line x1="24" y1="188" x2="696" y2="188" stroke="#e3e7ee"/>
    <!-- row 3 -->
    <text x="24" y="218" font-weight="700" fill="#0f1b2d">ROC annual filing</text>
    <rect x="300" y="206" width="62" height="18" rx="9" fill="#e8f5ec"/><text x="331" y="219" text-anchor="middle" font-size="9" fill="#15803d">Yearly</text>
    <text x="470" y="219" fill="#0f1b2d" font-family="monospace">30 Sep 2026</text>
    <circle cx="606" cy="215" r="4" fill="#15803d"/><text x="616" y="219" fill="#15803d">Active</text>
    <line x1="24" y1="236" x2="696" y2="236" stroke="#e3e7ee"/>
    <!-- row 4 -->
    <text x="24" y="266" font-weight="700" fill="#0f1b2d">Advance tax reminder</text>
    <rect x="300" y="254" width="78" height="18" rx="9" fill="#faf3e4"/><text x="339" y="267" text-anchor="middle" font-size="9" fill="#c4922f">Quarterly</text>
    <text x="470" y="267" fill="#0f1b2d" font-family="monospace">15 Sep 2026</text>
    <circle cx="606" cy="263" r="4" fill="#15803d"/><text x="616" y="267" fill="#15803d">Active</text>
  </g>

  <!-- callout card -->
  <rect x="24" y="300" width="672" height="120" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
  <rect x="24" y="300" width="4" height="120" rx="2" fill="#2563eb"/>
  <text x="44" y="330" font-size="12" font-weight="700" fill="#0f1b2d">Next ticket auto-created</text>
  <text x="44" y="352" font-size="11" fill="#46536e">The August GSTR-3B tickets for all 14 GST clients were generated</text>
  <text x="44" y="370" font-size="11" fill="#46536e">automatically and assigned — with the 11 Aug due date already set.</text>
  <rect x="44" y="384" width="120" height="22" rx="6" fill="#e8f5ec"/>
  <text x="104" y="399" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">14 tickets created</text>
</svg>
